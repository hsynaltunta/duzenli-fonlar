name: Fon verilerini güncelle

on:
  schedule:
    # Saat başı turlarını asıl olarak saat.yml başlatır; bu satır yalnız yedek.
    # GitHub zamanlayıcısı saat başlarında tetiklemeleri geciktirip düşürebildiği için dakikalar kaydırıldı.
    - cron: '17 4-16 * * *'       # yedek: her gün 07:17–19:17 (İstanbul)
    - cron: '47 20 * * *'         # her gün 23:47 (İstanbul): tüm fonların taranması
  workflow_dispatch:
    inputs:
      mod:
        description: 'intraday (saati gelen fonlar), nightly (tam tarama) ya da render (yalnız site)'
        default: intraday

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # gece taraması ertesi sabahın saat görevini başlatır

concurrency:
  group: fon-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    env:
      MOD: ${{ github.event.schedule == '47 20 * * *' && 'nightly' || inputs.mod || 'intraday' }}
    steps:
      # Geciken bir tur, tetiklendiği andaki eski kodu değil ana dalın son halini alsın
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verileri güncelle
        run: |
          echo "Mod: $MOD"
          python scripts/run.py "$MOD"

      - name: Değişiklik var mı
        id: diff
        run: |
          git add -A data
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; else echo "changed=1" >> "$GITHUB_OUTPUT"; fi

      - name: Veriyi kaydet
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "fon-guncelleme"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Veri: $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          # arada başka bir kayıt girdiyse onun üstüne al ve yeniden dene
          for i in 1 2 3; do
            git push && exit 0
            git pull -q --rebase
          done
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == '1' || github.event_name == 'workflow_dispatch'

      - uses: actions/upload-pages-artifact@v4
        if: steps.diff.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        with:
          path: public

      # GitHub'ın yayın servisi ara sıra "artifact bulunamadı" diye düşüyor; bir dakika sonra bir kez daha dene
      - id: deploy
        if: steps.diff.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Yayını yeniden denemeden önce bekle
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub zamanlayıcısı sabah tetiklemelerini saatlerce geciktirdiği için ertesi günün saat görevini
      # (07:00–19:00 saat başı turları) gece taraması başlatır; saat görevi sabahı bekler.
      - name: Yarının saat görevini başlat
        if: always() && env.MOD == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run saat.yml -f sabah=true
